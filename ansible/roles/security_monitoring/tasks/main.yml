---
- name: Create security monitoring script and data directories
  file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ secmon_base_dir }}", owner: 'root', group: "{{ secmon_group }}", mode: '0755' }
    - { path: "{{ secmon_base_dir }}/bin", owner: 'root', group: "{{ secmon_group }}", mode: '0750' }
    - { path: "{{ secmon_base_dir }}/data", owner: "{{ secmon_user }}", group: "{{ secmon_group }}", mode: '0750' }
    - { path: "{{ secmon_log_dir }}", owner: "{{ secmon_user }}", group: "{{ secmon_group }}", mode: '0755' }

- name: Deploy logrotate policy for security monitoring logs
  copy:
    dest: /etc/logrotate.d/security-monitor
    owner: root
    group: root
    mode: '0644'
    content: |
      {{ secmon_log_dir }}/*.log {
          daily
          missingok
          rotate 14
          compress
          delaycompress
          notifempty
          create 0640 {{ secmon_user }} {{ secmon_group }}
      }
