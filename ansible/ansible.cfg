[defaults]
# 1. Location of the default inventory file
inventory = inventory/hosts.ini

# 2. Default user to connect with on target servers
remote_user = automation

# 3. Path to the private SSH key on this machine
private_key_file = ~/.ssh/id_ed25519

# 4. Disable host key checking prompts inside automated Ansible runs
host_key_checking = False

# 5. Roles directory path
roles_path = roles

# 6. Output formatting (beautified, readable CLI output)
stdout_callback = yaml

# 7. Enable timing facts for playbooks
callbacks_enabled = timer, profile_tasks

[privilege_escalation]
# Automatically escalate privileges with sudo
become = True
become_method = sudo
become_user = root
become_ask_pass = False
